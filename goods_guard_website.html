<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goods Guard | Shipment Control</title>
<style>
:root{--bg:#fff;--surface:#fff;--soft:#f5f6f7;--line:#e3e5e8;--text:#111;--muted:#626872;--dark:#17191c;--green:#16834a;--amber:#a56600;--red:#c52c2c;--shadow:0 8px 28px rgba(0,0,0,.055)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.sidebar{border-right:1px solid var(--line);padding:22px 14px;background:#fff;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:10px;padding:3px 10px 25px;font-weight:800;font-size:20px;letter-spacing:-.5px}.logo{width:36px;height:36px;background:#111;color:white;border-radius:11px;display:grid;place-items:center;font-weight:800}.brand small{display:block;font-size:10px;letter-spacing:1.8px;color:var(--muted);font-weight:600}.nav-label{font-size:10px;color:#858a92;font-weight:800;letter-spacing:1.6px;padding:10px 12px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#4c5158;text-align:left;padding:11px 12px;border-radius:10px;display:flex;gap:12px;align-items:center;font-weight:600}.nav button.active,.nav button:hover{background:#f0f1f2;color:#111}.nav .ico{width:20px;text-align:center;font-size:17px}.side-bottom{position:absolute;bottom:18px;left:20px;right:20px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:14px}.main{min-width:0}.topbar{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);z-index:5}.crumb{font-size:13px;color:var(--muted)}.topright{display:flex;align-items:center;gap:12px}.avatar{width:35px;height:35px;background:#eee;border-radius:50%;display:grid;place-items:center;font-weight:800}.content{padding:30px 34px 55px;max-width:1450px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:25px}.eyebrow{font-size:11px;letter-spacing:1.7px;color:#777;font-weight:800}.pagehead h1{font-size:30px;letter-spacing:-1px;margin:4px 0 5px}.sub{color:var(--muted);margin:0}.btn{border:1px solid var(--line);background:white;color:#111;border-radius:9px;padding:10px 14px;font-weight:700;display:inline-flex;gap:8px;align-items:center;justify-content:center}.btn.dark{background:#111;color:white;border-color:#111}.btn:active{transform:translateY(1px)}.btn.small{padding:7px 10px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;gap:17px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:22px}.card{border:1px solid var(--line);background:white;border-radius:15px;padding:20px;box-shadow:var(--shadow);min-width:0}.stat-label{font-size:13px;color:var(--muted);font-weight:600}.stat-number{font-size:31px;font-weight:800;letter-spacing:-1px;margin:8px 0 4px}.stat-foot{font-size:12px;color:var(--muted)}.section-title{font-size:17px;font-weight:800;margin:0 0 14px}.split{grid-template-columns:1.4fr 1fr}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;border-bottom:1px solid #eee;padding:13px 12px;font-size:13px;white-space:nowrap}th{font-size:10px;letter-spacing:1.2px;color:#777;font-weight:800}tbody tr:last-child td{border-bottom:0}.code{font-weight:800}.pill{display:inline-flex;border-radius:99px;padding:4px 9px;font-size:11px;font-weight:800;background:#f0f1f2;color:#333}.pill.green{background:#e5f6ec;color:var(--green)}.pill.amber{background:#fff3d9;color:var(--amber)}.pill.red{background:#ffe7e7;color:var(--red)}.empty{padding:32px;text-align:center;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:#454950}.field input,.field select,.field textarea{width:100%;border:1px solid #d8dbe0;background:#fff;border-radius:9px;padding:11px 12px;color:#111;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#111;box-shadow:0 0 0 3px #11111112}.help{font-size:12px;color:var(--muted)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.notice{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fafafa;color:#454950;font-size:13px;margin:12px 0}.notice strong{color:#111}.mapbox{min-height:220px;background:repeating-linear-gradient(0deg,#f7f7f7,#f7f7f7 38px,#ededed 39px),repeating-linear-gradient(90deg,transparent,transparent 38px,#ededed 39px);border:1px solid var(--line);border-radius:14px;display:grid;place-items:center;text-align:center;padding:20px}.mapdot{font-size:36px}.coord{font-family:ui-monospace,monospace;font-size:12px;color:#555;word-break:break-all}.hidden{display:none!important}.toast{position:fixed;bottom:20px;right:20px;background:#111;color:white;padding:13px 17px;border-radius:11px;box-shadow:var(--shadow);z-index:20;max-width:calc(100% - 40px)}.mobilemenu{display:none}.progress{height:7px;border-radius:99px;background:#eee;overflow:hidden}.progress span{display:block;height:100%;background:#111;width:0}.featurelist{display:grid;gap:12px}.feature{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid #eee}.feature:last-child{border:0}.featureicon{width:36px;height:36px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;flex-shrink:0}.feature p{margin:2px 0;color:var(--muted);font-size:12px}.dangertext{color:var(--red)}.footer-note{font-size:11px;color:#777;margin-top:20px}
@media(max-width:950px){.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:10;left:-260px;width:245px;transition:left .2s;box-shadow:var(--shadow)}.sidebar.open{left:0}.mobilemenu{display:inline-flex}.topbar{padding:0 17px}.content{padding:24px 17px 45px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}.side-bottom{position:static;margin-top:25px}.pagehead h1{font-size:25px}}
@media(max-width:560px){.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.pagehead{flex-direction:column}.stats{gap:10px}.card{padding:15px}.stat-number{font-size:26px}.topbar{height:65px}.topright .org{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">G</div><div>GOODS GUARD<small>SHIPMENT CONTROL</small></div></div>
  <div class="nav-label">WORKSPACE</div>
  <nav class="nav" id="nav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button>
    <button data-page="shipments"><span class="ico">▤</span>Shipments</button>
    <button data-page="add"><span class="ico">＋</span>Add Shipment</button>
    <button data-page="tracking"><span class="ico">⌖</span>Live GPS Tracking</button>
    <button data-page="alerts"><span class="ico">⚑</span>Problem Alerts</button>
    <button data-page="verification"><span class="ico">✓</span>Delivery Verification</button>
    <button data-page="reports"><span class="ico">▥</span>Company Reports</button>
    <button data-page="payments"><span class="ico">₹</span>Payments</button>
  </nav>
  <div class="side-bottom">Goods Guard Demo<br><span id="saveStatus">Local save enabled</span></div>
</aside>
<main class="main">
<header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn mobilemenu" id="menuBtn" aria-label="Open menu">☰</button><div class="crumb">Workspace / <strong id="crumb">Dashboard</strong></div></div><div class="topright"><span class="org">Demo Logistics Company</span><div class="avatar">D</div></div></header>
<div class="content" id="content"></div>
</main>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<script>
const KEY='goods_guard_shipments_v1';
const defaultShipments=[
{id:'GG-1048',goods:'Textile cartons',origin:'Chennai',destination:'Bengaluru',status:'In Transit',alert:'None',verified:false,created:new Date().toISOString(),lat:null,lng:null},
{id:'GG-1049',goods:'Machine spare parts',origin:'Pune',destination:'Hyderabad',status:'Delivered',alert:'None',verified:true,created:new Date().toISOString(),lat:null,lng:null},
{id:'GG-1050',goods:'Packaged food',origin:'Coimbatore',destination:'Chennai',status:'Delayed',alert:'Delay reported',verified:false,created:new Date().toISOString(),lat:null,lng:null}
];
let shipments=loadShipments(),page='dashboard',selectedId='',gpsWatch=null,lastPosition=null;
function loadShipments(){try{const v=localStorage.getItem(KEY);return v?JSON.parse(v):defaultShipments}catch(e){return defaultShipments}}
function saveShipments(){try{localStorage.setItem(KEY,JSON.stringify(shipments));document.getElementById('saveStatus').textContent='Saved on this device';return true}catch(e){toast('Could not save on this device. Check browser storage settings.');return false}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.add('hidden'),3200)}
function statusClass(s){return s==='Delivered'?'green':s==='Delayed'||s==='Problem Reported'?'red':s==='In Transit'?'amber':''}
function pill(s){return `<span class="pill ${statusClass(s)}">${esc(s)}</span>`}
function pageHead(kicker,title,sub,action=''){return `<div class="pagehead"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="sub">${sub}</p></div>${action}</div>`}
function tableRows(list){if(!list.length)return `<tr><td colspan="6"><div class="empty">No shipments found.</div></td></tr>`;return list.map(s=>`<tr><td class="code">${esc(s.id)}</td><td>${esc(s.goods)}</td><td>${esc(s.origin)} → ${esc(s.destination)}</td><td>${pill(s.status)}</td><td>${s.alert&&s.alert!=='None'?pill(s.alert):'<span class="help">No alert</span>'}</td><td><button class="btn small" onclick="openShipment('${esc(s.id)}')">View</button></td></tr>`).join('')}
function shipmentTable(list=shipments){return `<div class="table-wrap"><table><thead><tr><th>SHIPMENT ID</th><th>GOODS</th><th>ROUTE</th><th>STATUS</th><th>ALERT</th><th>ACTION</th></tr></thead><tbody>${tableRows(list)}</tbody></table></div>`}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('crumb').textContent=({dashboard:'Dashboard',shipments:'Shipments',add:'Add Shipment',tracking:'Live GPS Tracking',alerts:'Problem Alerts',verification:'Delivery Verification',reports:'Company Reports',payments:'Payments'})[page];const c=document.getElementById('content');c.innerHTML=({dashboard:dashboardPage,shipments:shipmentsPage,add:addPage,tracking:trackingPage,alerts:alertsPage,verification:verificationPage,reports:reportsPage,payments:paymentsPage})[page]();document.getElementById('sidebar').classList.remove('open')}
function dashboardPage(){const transit=shipments.filter(s=>s.status==='In Transit').length,del=shipments.filter(s=>s.status==='Delivered').length,pro=shipments.filter(s=>s.alert!=='None'&&s.alert).length;return `${pageHead('OVERVIEW','Shipment dashboard','A simple view of your shipment operations.',`<button class="btn dark" onclick="go('add')">＋ Add shipment</button>`)}<div class="grid stats"><div class="card"><div class="stat-label">Total shipments</div><div class="stat-number">${shipments.length}</div><div class="stat-foot">Saved in this browser</div></div><div class="card"><div class="stat-label">In transit</div><div class="stat-number">${transit}</div><div class="stat-foot">Currently moving</div></div><div class="card"><div class="stat-label">Delivered</div><div class="stat-number">${del}</div><div class="stat-foot">Marked delivered</div></div><div class="card"><div class="stat-label">Problem alerts</div><div class="stat-number">${pro}</div><div class="stat-foot">Need attention</div></div></div><div class="grid split"><section class="card"><div class="pagehead" style="margin-bottom:8px;align-items:center"><h2 class="section-title">Recent shipments</h2><button class="btn small" onclick="go('shipments')">View all</button></div>${shipmentTable([...shipments].slice(-5).reverse())}</section><section class="card"><h2 class="section-title">Quick actions</h2><div class="featurelist"><div class="feature"><div class="featureicon">＋</div><div><strong>Add a shipment</strong><p>Record goods, origin, destination and status.</p><button class="btn small" onclick="go('add')">Create shipment</button></div></div><div class="feature"><div class="featureicon">⌖</div><div><strong>Check GPS</strong><p>Share this device's location if permission is granted.</p><button class="btn small" onclick="go('tracking')">Open tracking</button></div></div><div class="feature"><div class="featureicon">₹</div><div><strong>Payment test</strong><p>Review a sample ₹50-per-shipment estimate.</p><button class="btn small" onclick="go('payments')">View payments</button></div></div></div></section></div><p class="footer-note">Demo notice: shipment records save in this browser only. They are not shared with other users or saved to Supabase yet.</p>`}
function shipmentsPage(){return `${pageHead('OPERATIONS','All shipments','Search and inspect your shipment records.',`<button class="btn dark" onclick="go('add')">＋ Add shipment</button>`)}<div class="card"><div class="formgrid" style="margin-bottom:18px"><div class="field"><label for="searchShip">Search shipments</label><input id="searchShip" placeholder="ID, goods, origin or destination" oninput="filterShipments()"></div><div class="field"><label for="filterStatus">Filter by status</label><select id="filterStatus" onchange="filterShipments()"><option value="">All statuses</option><option>In Transit</option><option>Delivered</option><option>Delayed</option><option>Problem Reported</option><option>Booked</option></select></div></div><div id="shipmentTable">${shipmentTable([...shipments].reverse())}</div></div>`}
function addPage(){return `${pageHead('NEW RECORD','Add shipment','Enter shipment details. The ID is generated automatically.')}<div class="card"><form id="addForm"><div class="formgrid"><div class="field"><label for="goods">Goods name *</label><input id="goods" required maxlength="100" placeholder="e.g. Electronics cartons"></div><div class="field"><label for="status">Shipment status *</label><select id="status" required><option>Booked</option><option>In Transit</option><option>Delayed</option><option>Delivered</option><option>Problem Reported</option></select></div><div class="field"><label for="origin">Origin *</label><input id="origin" required maxlength="100" placeholder="e.g. Chennai"></div><div class="field"><label for="destination">Destination *</label><input id="destination" required maxlength="100" placeholder="e.g. Bengaluru"></div><div class="field full"><label for="alert">Problem alert</label><select id="alert"><option>None</option><option>Delay reported</option><option>Goods damaged</option><option>Seal mismatch</option><option>Route issue</option><option>Other issue</option></select></div></div><div class="notice"><strong>Privacy note:</strong> This version saves shipments to this browser's local storage. It does not yet send records to your Supabase database or other company users.</div><div class="actions"><button class="btn dark" type="submit">Save shipment</button><button class="btn" type="button" onclick="go('shipments')">Cancel</button></div></form></div>`}
function trackingPage(){const s=shipments.find(x=>x.id===selectedId)||shipments.find(x=>x.status==='In Transit')||shipments[0];return `${pageHead('LOCATION SERVICES','Live GPS tracking','Uses this device’s GPS only after you grant permission.')}<div class="grid split"><section class="card"><h2 class="section-title">Select shipment</h2><div class="field"><label for="trackSelect">Shipment</label><select id="trackSelect" onchange="selectedId=this.value;render()">${shipments.map(x=>`<option value="${esc(x.id)}" ${x.id===s?.id?'selected':''}>${esc(x.id)} — ${esc(x.goods)}</option>`).join('')}</select></div><div class="notice">Important: this reads the location of the device you allow. It does not automatically track a truck or driver unless their device shares GPS data with the app.</div><div class="actions"><button class="btn dark" onclick="getGPS()">Get current GPS location</button><button class="btn" onclick="stopGPS()">Stop GPS</button></div><div id="gpsResult" style="margin-top:16px">${lastPosition?gpsDetails(lastPosition):'<p class="help">GPS has not been started.</p>'}</div></section><section class="card"><h2 class="section-title">Location preview</h2><div class="mapbox"><div><div class="mapdot">⌖</div><strong id="mapLabel">${lastPosition?'Device location captured':'No GPS location yet'}</strong><p class="help">This demo does not include a live map provider.</p><div class="coord" id="mapCoords">${lastPosition?lastPosition.latitude+', '+lastPosition.longitude:'Coordinates will appear here'}</div></div></div><p class="footer-note">GPS requires HTTPS and permission. On GitHub Pages, allow location access in your browser if prompted.</p></section></div>`}
function gpsDetails(p){return `<div class="notice"><strong>Device location captured</strong><div class="coord">Latitude: ${p.latitude}<br>Longitude: ${p.longitude}<br>Accuracy: ±${Math.round(p.accuracy||0)} metres</div></div>`}
function alertsPage(){const list=shipments.filter(s=>s.alert&&s.alert!=='None');return `${pageHead('EXCEPTIONS','Problem alerts','Review and resolve shipment issues.')}<div class="card"><h2 class="section-title">Open alerts (${list.length})</h2>${list.length?`<div class="table-wrap"><table><thead><tr><th>SHIPMENT</th><th>ISSUE</th><th>STATUS</th><th>ACTION</th></tr></thead><tbody>${list.map(s=>`<tr><td class="code">${esc(s.id)}</td><td>${esc(s.alert)}</td><td>${pill(s.status)}</td><td><button class="btn small" onclick="resolveAlert('${esc(s.id)}')">Resolve</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No open alerts. You are all caught up.</div>'}</div>`}
function verificationPage(){return `${pageHead('PROOF OF DELIVERY','Delivery verification','Mark delivery as verified after checking proof of delivery.')}<div class="card"><div class="table-wrap"><table><thead><tr><th>SHIPMENT</th><th>GOODS</th><th>DESTINATION</th><th>DELIVERY STATUS</th><th>VERIFICATION</th><th>ACTION</th></tr></thead><tbody>${shipments.map(s=>`<tr><td class="code">${esc(s.id)}</td><td>${esc(s.goods)}</td><td>${esc(s.destination)}</td><td>${pill(s.status)}</td><td>${s.verified?'<span class="pill green">Verified</span>':'<span class="pill amber">Pending</span>'}</td><td><button class="btn small" ${s.verified?'disabled':''} onclick="verifyDelivery('${esc(s.id)}')">Verify</button></td></tr>`).join('')}</tbody></table></div><div class="notice">Demo verification is a manual checkbox-like action. It does not collect a signature, photo, OTP or legal proof.</div></div>`}
function reportsPage(){const total=shipments.length,del=shipments.filter(s=>s.status==='Delivered').length,alerts=shipments.filter(s=>s.alert!=='None'&&s.alert).length;return `${pageHead('ANALYTICS','Company reports','A simple summary of the records saved in this browser.',`<button class="btn dark" onclick="exportCSV()">Export CSV</button>`)}<div class="grid stats"><div class="card"><div class="stat-label">Shipments recorded</div><div class="stat-number">${total}</div></div><div class="card"><div class="stat-label">Delivered</div><div class="stat-number">${del}</div></div><div class="card"><div class="stat-label">Delivery verified</div><div class="stat-number">${shipments.filter(s=>s.verified).length}</div></div><div class="card"><div class="stat-label">With alerts</div><div class="stat-number">${alerts}</div></div></div><div class="card"><h2 class="section-title">Delivery completion</h2><p class="sub">${total?Math.round(del/total*100):0}% of recorded shipments marked delivered</p><div class="progress" style="margin-top:15px"><span style="width:${total?del/total*100:0}%"></span></div><p class="footer-note">Reports are calculated from this browser’s saved demo records. They are not official accounting or operational reports.</p></div>`}
function paymentsPage(){const amount=shipments.length*50;return `${pageHead('BILLING','Payments','Review a sample usage estimate. No money will be charged.')}<div class="grid split"><section class="card"><div class="eyebrow">SAMPLE PRICING</div><h2 style="font-size:42px;margin:8px 0">₹50 <span style="font-size:15px;color:#777;font-weight:600">/ shipment</span></h2><p class="sub">Example starting price for shipment tracking, problem alerts, delivery verification and company reports.</p><hr style="border:0;border-top:1px solid #eee;margin:22px 0"><div style="display:flex;justify-content:space-between;margin:10px 0"><span>Shipments in this demo</span><strong>${shipments.length}</strong></div><div style="display:flex;justify-content:space-between;margin:10px 0"><span>Sample total</span><strong>₹${amount.toLocaleString('en-IN')}</strong></div><div class="notice"><strong>Demo only:</strong> This page does not collect payment or connect to a payment gateway. Do not enter card, UPI PIN or bank details.</div><button class="btn dark" onclick="toast('Payment is not connected yet. No money was charged.')">Test payment button</button></section><section class="card"><h2 class="section-title">Payment setup checklist</h2><div class="featurelist"><div class="feature"><div class="featureicon">1</div><div><strong>Business account</strong><p>Set up a verified business profile with a payment provider.</p></div></div><div class="feature"><div class="featureicon">2</div><div><strong>Secure backend</strong><p>Create server-side orders and verify payment status. Never put secret keys in website code.</p></div></div><div class="feature"><div class="featureicon">3</div><div><strong>Real payment gateway</strong><p>Integrate a provider such as Razorpay only after the backend and account are ready.</p></div></div></div></section></div>`}
function go(p){if(gpsWatch!==null&&p!=='tracking')stopGPS();page=p;render();window.scrollTo(0,0)}
function openShipment(id){selectedId=id;go('tracking')}
function filterShipments(){const q=(document.getElementById('searchShip')?.value||'').toLowerCase(),st=document.getElementById('filterStatus')?.value||'';const list=[...shipments].reverse().filter(s=>(!st||s.status===st)&&[s.id,s.goods,s.origin,s.destination].some(x=>String(x).toLowerCase().includes(q)));document.getElementById('shipmentTable').innerHTML=shipmentTable(list)}
function nextId(){let max=1000;shipments.forEach(s=>{const m=String(s.id).match(/^GG-(\d+)$/);if(m)max=Math.max(max,Number(m[1]))});return 'GG-'+(max+1)}
document.addEventListener('submit',e=>{if(e.target.id!=='addForm')return;e.preventDefault();const s={id:nextId(),goods:document.getElementById('goods').value.trim(),origin:document.getElementById('origin').value.trim(),destination:document.getElementById('destination').value.trim(),status:document.getElementById('status').value,alert:document.getElementById('alert').value,verified:false,created:new Date().toISOString(),lat:null,lng:null};if(!s.goods||!s.origin||!s.destination)return;shipments.push(s);if(saveShipments()){toast('Shipment '+s.id+' saved on this device.');go('shipments')}});
function resolveAlert(id){const s=shipments.find(x=>x.id===id);if(s){s.alert='None';saveShipments();render();toast('Alert resolved for '+id)}}
function verifyDelivery(id){const s=shipments.find(x=>x.id===id);if(s){s.verified=true;s.status='Delivered';saveShipments();render();toast('Delivery marked verified for '+id)}}
function getGPS(){if(!navigator.geolocation){toast('This browser does not support GPS location.');return}toast('Requesting GPS permission…');navigator.geolocation.getCurrentPosition(pos=>{lastPosition={latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy};const s=shipments.find(x=>x.id===selectedId);if(s){s.lat=lastPosition.latitude;s.lng=lastPosition.longitude;saveShipments()}const box=document.getElementById('gpsResult');if(box)box.innerHTML=gpsDetails(lastPosition);const label=document.getElementById('mapLabel');if(label)label.textContent='Device location captured';const coords=document.getElementById('mapCoords');if(coords)coords.textContent=lastPosition.latitude+', '+lastPosition.longitude;toast('GPS location received. This is this device’s location.')},err=>{const msgs={1:'Location permission was denied. Allow it in browser settings.',2:'GPS position is unavailable. Try outdoors or enable Location.',3:'GPS request timed out. Try again.'};toast(msgs[err.code]||'Could not get GPS location.')},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
function stopGPS(){if(gpsWatch!==null){navigator.geolocation?.clearWatch(gpsWatch);gpsWatch=null;toast('GPS tracking stopped.')}}
function exportCSV(){const rows=[['ID','Goods','Origin','Destination','Status','Alert','Verified','Created'],...shipments.map(s=>[s.id,s.goods,s.origin,s.destination,s.status,s.alert,s.verified?'Yes':'No',s.created])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='goods-guard-report.csv';a.click();URL.revokeObjectURL(url);toast('CSV report downloaded.')}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));window.addEventListener('storage',e=>{if(e.key===KEY){shipments=loadShipments();render()}});render();
</script>
</body>
</html>
